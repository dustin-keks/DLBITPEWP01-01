@if ((userRole | async) === 'ROLE_ADMIN') {
    <div class="container">
        <div class="alert alert-info mt-3" role="alert">
            Du bist als Admin eingeloggt!
            <a routerLink="/admin/categories" class="btn btn-dark mt-2 mt-sm-0 me-2">
                <i class="bi bi-gear"></i> Kategorien verwalten
            </a>
            <a routerLink="/admin/products" class="btn btn-dark mt-2 mt-sm-0 me-2">
                <i class="bi bi-gear"></i> Produkte verwalten
            </a>
        </div>
    </div>
}
